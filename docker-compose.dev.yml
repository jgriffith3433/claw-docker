services:
  openclaw-gateway:
    build: .
    image: jgriffith3433/claw-docker:local
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GIT_LFS_SKIP_SMUDGE: ${GIT_LFS_SKIP_SMUDGE:-1}
      UNITY_MCP_HOST: ${UNITY_MCP_HOST:-host.docker.internal}
      UNITY_MCP_PORT: ${UNITY_MCP_PORT:-8090}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      COMFYUI_HOST: ${COMFYUI_HOST:-host.docker.internal}
      COMFYUI_PORT: ${COMFYUI_PORT:-8188}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DOCKER_HUB_TOKEN: ${DOCKER_HUB_TOKEN:-}
      DOCKER_HUB_USERNAME: ${DOCKER_HUB_USERNAME:-jgriffith3433}
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE:-./workspace}:/home/node/.openclaw/workspace
      - ${UNITY_PROJECT_PATH:-C:/Projects/sickofitgame-unity}:/home/node/.openclaw/workspace/sickofitgame-unity
      - ${WEBSITE_PROJECT_PATH:-C:/Projects/sickofitgame-website}:/home/node/.openclaw/workspace/sickofitgame-website
      - ${CLAW_DOCKER_PATH:-C:/Projects/claw-docker}:/home/node/.openclaw/workspace/claw-docker
      - ${COMFYUI_DOCKER_PATH:-C:/Projects/comfyui-docker}:/home/node/.openclaw/workspace/comfyui-docker
      - ${COMFYUI_DATA:-C:/Projects/comfyui-docker/data}/models:/home/node/.openclaw/workspace/comfyui-models
      - ${COMFYUI_DATA:-C:/Projects/comfyui-docker/data}/output:/home/node/.openclaw/workspace/comfyui-output
      - ${COMFYUI_DATA:-C:/Projects/comfyui-docker/data}/input:/home/node/.openclaw/workspace/comfyui-input
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped

  openclaw-cli:
    image: jgriffith3433/claw-docker:local
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GIT_LFS_SKIP_SMUDGE: ${GIT_LFS_SKIP_SMUDGE:-1}
      BROWSER: echo
      COMFYUI_HOST: ${COMFYUI_HOST:-host.docker.internal}
      COMFYUI_PORT: ${COMFYUI_PORT:-8188}
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE:-./workspace}:/home/node/.openclaw/workspace
      - ${UNITY_PROJECT_PATH:-C:/Projects/sickofitgame-unity}:/home/node/.openclaw/workspace/sickofitgame-unity
      - ${WEBSITE_PROJECT_PATH:-C:/Projects/sickofitgame-website}:/home/node/.openclaw/workspace/sickofitgame-website
      - ${CLAW_DOCKER_PATH:-C:/Projects/claw-docker}:/home/node/.openclaw/workspace/claw-docker
      - ${COMFYUI_DOCKER_PATH:-C:/Projects/comfyui-docker}:/home/node/.openclaw/workspace/comfyui-docker
      - ${COMFYUI_DATA:-C:/Projects/comfyui-docker/data}/models:/home/node/.openclaw/workspace/comfyui-models
      - ${COMFYUI_DATA:-C:/Projects/comfyui-docker/data}/output:/home/node/.openclaw/workspace/comfyui-output
      - ${COMFYUI_DATA:-C:/Projects/comfyui-docker/data}/input:/home/node/.openclaw/workspace/comfyui-input
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["/opt/openclaw/docker-entrypoint.sh", "node", "dist/index.js"]

volumes:
  openclaw-data:
